
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Check and generate API configuration
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          set -e

          if [ -z "$OPENWEATHER_API_KEY" ]; then
            echo "ERROR: API key secret is empty or unavailable."
            exit 1
          fi

          printf 'window.CONFIG = { WEATHER_API_KEY: "%s" };\n' "$OPENWEATHER_API_KEY" > config.js

          test -s config.js
          grep -q 'window.CONFIG' config.js

          echo "Configuration file generated successfully."
          echo "File size: $(wc -c < config.js) bytes"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
